[package]
name = "hid_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Enable hardware-dependent integration tests:
#   cargo test --test integration_tests --features integration-tests
[features]
integration-tests = []
# Gate examples behind a feature so `cargo test --target wasm32` skips them.
# Run examples with: cargo run --example simple_test --features examples
examples = []

[dependencies]
log = "0.4"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.18"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
hidapi = "2.6"
hidreport = "0.4.0"
env_logger = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
hidreport = "0.4.0"
android_logger = "0.13"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1.0"
web-sys = { version = "0.3", features = ["Hid", "HidDevice", "Navigator", "Window", "HidDeviceRequestOptions", "HidConnectionEvent", "HidInputReportEvent"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[[example]]
name = "simple_test"
path = "examples/simple_test.rs"
required-features = ["examples"]

[[example]]
name = "device_list_timing"
path = "examples/device_list_timing.rs"
required-features = ["examples"]

[dev-dependencies]
env_logger = "0.10"

# tokio uses mio which does not support wasm32; exclude it from WASM builds.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
